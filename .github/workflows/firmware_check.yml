on:
  schedule:
    # 北京时间周二到周六 00:37-07:52（每 15 分钟）= UTC 周一至周五 16:37-23:52
    # 分钟错开 :00/:15/:30/:45，这些整点时段 GitHub 负载高，定时任务容易被延迟或丢弃
    - cron: '37,52 16 * * 1-5'
    - cron: '7,22,37,52 17-23 * * 1-5'
  workflow_dispatch:
    inputs:
      resend_attachment:
        description: "Existing *_updates.txt file to email manually"
        required: false
        type: string

# 避免手动补发与定时检测同时运行导致 push 冲突
concurrency:
  group: firmware-check
  cancel-in-progress: false

jobs:
  check-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Dependencies
        if: github.event.inputs.resend_attachment == ''
        run: pip install -r requirements.txt

      - name: Run firmware checker
        if: github.event.inputs.resend_attachment == ''
        run: python3 firmware_checker.py

      - name: Detect update attachment
        id: detect_updates
        shell: bash
        env:
          MANUAL_ATTACHMENT: ${{ github.event.inputs.resend_attachment }}
        run: |
          if [ -n "$MANUAL_ATTACHMENT" ]; then
            case "$MANUAL_ATTACHMENT" in
              *_updates.txt)
                ;;
              *)
                echo "Manual attachment must match *_updates.txt"
                exit 1
                ;;
            esac

            if [ ! -f "$MANUAL_ATTACHMENT" ]; then
              echo "Manual attachment file not found: $MANUAL_ATTACHMENT"
              exit 1
            fi

            echo "has_updates=true" >> "$GITHUB_OUTPUT"
            echo "attachment_path=$MANUAL_ATTACHMENT" >> "$GITHUB_OUTPUT"
            echo "send_mode=manual" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # firmware_checker.py 仅在检测到 SHA1 变化时写入这两个文件，
          # 即使当天附件内容没有变化，数据库也会被提交、邮件也会发送。
          if [ ! -f log/firmware_updates.json ]; then
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
            echo "send_mode=auto" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          attachment_path="$(< log/update_attachment.txt)"

          echo "has_updates=true" >> "$GITHUB_OUTPUT"
          echo "attachment_path=$attachment_path" >> "$GITHUB_OUTPUT"
          echo "send_mode=auto" >> "$GITHUB_OUTPUT"

      - name: Build update email
        id: build_email
        if: steps.detect_updates.outputs.has_updates == 'true'
        continue-on-error: true
        shell: bash
        env:
          ATTACHMENT_PATH: ${{ steps.detect_updates.outputs.attachment_path }}
          SEND_MODE: ${{ steps.detect_updates.outputs.send_mode }}
        run: |
          python3 firmware_email.py --attachment "$ATTACHMENT_PATH" --mode "$SEND_MODE"
          echo "subject=$(< log/email/subject.txt)" >> "$GITHUB_OUTPUT"

      # 先提交再发信：提交失败时不发信，下一轮会重新检测并通知，避免重复邮件
      - name: Commit and push if changed
        if: steps.detect_updates.outputs.send_mode == 'auto' && steps.detect_updates.outputs.has_updates == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Automated update firmware data"
          file_pattern: "*.db *.xml updates/*.txt"
          commit_user_name: "Github Actions Bot"
          commit_user_email: "actions@github.com"

      - name: Send update email
        id: send_email
        if: steps.detect_updates.outputs.has_updates == 'true' && steps.build_email.outcome == 'success'
        continue-on-error: true
        uses: dawidd6/action-send-mail@v22
        with:
          server_address: smtp.mail.me.com
          server_port: 587
          secure: false
          username: ${{ secrets.MAIL_SMTP_USERNAME }}
          password: ${{ secrets.MAIL_SMTP_PASSWORD }}
          subject: ${{ steps.build_email.outputs.subject }}
          to: ${{ secrets.MAIL_TO }}
          from: ${{ vars.MAIL_FROM }}
          body: file://log/email/body.txt
          attachments: ${{ steps.detect_updates.outputs.attachment_path }}

      - name: Fail workflow if email notification failed
        if: always() && steps.detect_updates.outputs.has_updates == 'true' && (steps.build_email.outcome == 'failure' || steps.send_email.outcome == 'failure')
        run: |
          echo "Firmware update email failed to build or send."
          exit 1
